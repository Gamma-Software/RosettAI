# rai-generated sha256:01ca7ae5f5c797d0c570e5996d4df9e902ef4bf0cb4e3d7e3754fbf96e66d74f
# Codex projection from .agents/ (tested with codex-cli 0.152.1)

[mcp_servers.docs]
url = "https://example.invalid/mcp"
bearer_token_env_var = "DOCS_TOKEN"

[mcp_servers.local]
command = "npx"
cwd = "tools"
args = ["-y", "example-mcp"]
env_vars = ["LOCAL_TOKEN"]

[agents]
enabled = true

[agents.reviewer]
config_file = "agents/reviewer.toml"
description = "Review changes for correctness and regressions."

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "rai sync --codex-hook"
timeout = 30

[[hooks.PreToolUse]]
matcher = "^(apply_patch|Edit|Write)$"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "rai guard"
timeout = 10
