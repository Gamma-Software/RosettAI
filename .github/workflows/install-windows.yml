name: Windows installer

on:
  push:
    paths:
      - install.sh
      - install.ps1
      - .github/workflows/install-windows.yml
  pull_request:
    paths:
      - install.sh
      - install.ps1
      - .github/workflows/install-windows.yml

jobs:
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install from Git Bash
        shell: bash
        run: bash ./install.sh
      - name: Verify Git Bash installation
        shell: pwsh
        run: |
          $binary = Join-Path $env:LOCALAPPDATA 'Programs\rai\rai.exe'
          if (-not (Test-Path $binary -PathType Leaf)) {
            throw 'Git Bash did not install rai.exe'
          }
      - name: Install prebuilt CLI
        shell: pwsh
        run: |
          $env:RAI_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'rai-install-test'
          & ./install.ps1
          & ./install.ps1
          $testRepo = Join-Path $env:RUNNER_TEMP 'rai-project'
          New-Item -ItemType Directory -Path $testRepo | Out-Null
          & (Join-Path $env:RAI_INSTALL_DIR 'rai.exe') init --repo $testRepo
          $pathRepo = Join-Path $env:RUNNER_TEMP 'rai-path-project'
          New-Item -ItemType Directory -Path $pathRepo | Out-Null
          rai init --repo $pathRepo
          if (-not (Test-Path (Join-Path $pathRepo '.agents/rules/general.md'))) {
            throw 'rai init did not create the starter rule'
          }
