name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Test
        run: cargo test --locked --target "${{ matrix.target }}"
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package Unix binary
        if: runner.os != 'Windows'
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir dist
          tar -C "target/$TARGET/release" -czf "dist/rai-$TAG-$TARGET.tar.gz" rai
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Path dist
          Compress-Archive -Path "target/$env:TARGET/release/rai.exe" -DestinationPath "dist/rai-$env:TAG-$env:TARGET.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: rai-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rai-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum rai-*.tar.gz rai-*.zip > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          options=()
          if [[ "$TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes "${options[@]}"
